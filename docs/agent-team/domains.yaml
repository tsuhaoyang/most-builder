      - "src/frontend/e2e/level-jobs-golden.spec.ts"
      - "src/frontend/e2e/wp12-*.spec.ts"
    docs:
      - docs/lb-integration/MOST_LB_DATA_CONTRACT_SPEC.md
      - docs/decisions/ADR-035-lb-projection-layer-and-motion-decomposition.md
      - docs/lb-integration/LB_PROJECTION_IMPLEMENTATION_PLAN.md
      - docs/decisions/ADR-036-lb-writeback-consumption.md
      - docs/lb-integration/LB_WRITEBACK_CONSUMPTION_IMPLEMENTATION_SPEC.md
    keywords: [lb, projection, 投影, lb-csv, task, tool episode, acquire, release, quantity, qty_scope, repeat, contract_version, writeback, 回寫]
    invariants:
      - CSV 24 欄名與順序凍結；任何變動＝contract_version 升版＋LB 契約同步（Spec §6/§7.8）
      - 黃金 fixture 投影後與 server_node_tasks.expected.csv 逐位元相等（tasks_out=34）
      - E_TOOL_ID_SHARED_ACROSS_LOT 維持 E（擋匯出），降級條件＝LB feature/most-integration-phase2 合入 master 後
      - SIMO 從屬列不輸出、p2 恆空、complexity_level 恆空（ADR-035 D9 過渡守衛；SIMO 為定案，其餘為過渡）
      - repeat_counts 由 slot_inputs 推導（不得硬寫空 dict）；clone 保留全部 9 個 LB tag 欄
      - 回寫（ADR-036）只回流 offline，且必走 MOST 組內傳染與 R1–R9 驗證；其餘欄位（workers/station/units/line）唯讀；結構欄不回流。general 判定用 MOST 自己的 is_general，不從 LB payload 猜
      - 回寫件數（Howard 2026-09-18 裁；ADR-036 D6 件數一條已於 2026-09-21 修訂）不跨列加總（setup 列 units 是 used、不是件數）；該 motion 帶 units 的列有 qty_scope 就取 cyclic 列，都沒有才退回各列最大值並標 inferred_max；比對基準是 MOST 投影 quantity Q（不用 frequency）；**件數基準**的投影失敗不得讓 import／fetch／latest 失敗（標 units_baseline unavailable＋E 碼；apply-offline 另走 lb_export_report，不在此條）
      - 回寫 payload 驗證失敗（契約版本、缺必要欄位、型別、qty_scope 值域、source_wi_row_id 非 UUID）→ 整份 422 且不存快照（parse 先於 persist）；已存快照在現行驗證下讀不回 → 422，不得 500
      - apply-offline 的 body id（snapshot_id／wi_row_ids）非 UUID → 422，不得落成無信封 500；投影拋例外（逃得出投影的三類；_projection_raises() 另列 PrecedenceError 只是縱深）→ 端點仍 200 且離線照常套用，report.status 標 unavailable＋E 碼、errors／warnings 給 null（不得給 []），並把狀態與完整診斷留在 applied_rows（ADR-036 D2／D7 追記 2026-09-21；形狀見實作書 §2 B6）
      - export_warnings（LB §8）：**未知 reason 必須降級為 unknown 並照常存快照，不得 422**（與 qty_scope 未知值 422 刻意相反）；結構錯（缺 key 以外的缺欄、顯式 null、型別錯、負值）才 422；units_degraded 的 source_wi_row_id 必須先 str(UUID(...)) 正規化再掛到 motion；dropped_rows 的 task_id 是 LB 端 id，不得與 MOST 投影對應或反推 wi_row_id；丟列時缺口的 reason 不改、只加 lb_dropped_possible 旗標（ADR-036 D7 追記 2026-09-22；規則見實作書 §2 B4-6）
      - 回寫的聚合／diff 重算一律對快照 payload 重新 parse，不得從 lb_row_placements 反推（placements 無 qty_scope）
      - 任何把外部輸入拼進 LB URL 的路徑都要用 LB_ID_PATTERN（lb_client.py，^[A-Za-z0-9_-]{1,64}$）驗證——路由層 422 且不呼叫 LB、client 再擋一次（縱深）；只做 URL 編碼不夠（ADR-036 D7 追記）

