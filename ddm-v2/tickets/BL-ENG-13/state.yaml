  - "2026-10-24 human 答覆記錄（requirement 階段）。human 手打原話：『按你建議』，回應 orchestrator 當日對 human 的三題提問與建議，原文如下。(1) Q1：RBAC 的整合測試要不要納入這一票。票面「現況」字面寫「outbox／RBAC 的整合測試沒有任何 glob 覆蓋」，但「要做」只寫了 outbox 的對應測試。實際上整個 domains.yaml 沒有任何 tests/ 路徑，「測試沒有領域」是 MOST 全面的現象，範圍比一張 L1 票大很多。orchestrator 建議：不納入，另開票。這張票只登記 outbox 相關的兩個測試檔。(2) Q2：outbox 的兩支 migration（v2_0032、v2_0033）要不要納入這一票。票面沒提 migration，它們是一次性腳本。orchestrator 建議：不納入。日後要不要讓 check_agent_config 涵蓋 tests 與 migrations，是另一張票。(3) H1：只動 domains.yaml 的 paths 與文件登記，算不算 MOST 規則所說的「邏輯變更」。MOST 的規則定義是「改變 invariants 規則語意」才算邏輯變更。這次兩條 invariants 逐字不變，reviewer 在副本上逐領域逐欄比對確認過。灰色地帶是：把 7 個檔移出 auth-rbac，會改變哪個 reviewer 被觸發。orchestrator 建議：答「不算」。規則的對象是 invariants 的語意，不是 paths 的歸屬。invariants 不變由機械檢查守住，歸屬變動由 reviewer(domain) 審。答「算」的代價是 review 階段要額外多一道 human 邏輯變更裁決。orchestrator 補充：這題的語意是 MOST 自己的規則，human 若傾向保守，答「算」也完全合理。orchestrator 末句：human 回「Q1 不納入、Q2 不納入、H1 不算」就是照建議；任何一題想不同，直接點名那一題。human 的答覆即上述原話『按你建議』，不含其他文字。"
