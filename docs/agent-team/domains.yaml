      - docs/decisions/ADR-020-simo-contribution-semantics.md
      - docs/decisions/ADR-037-ai-service-integration.md
      - docs/decisions/ADR-038-unified-wi-workspace-and-two-stage-distance.md
    keywords: [worksheet, 工時表, wi_row, most_cycle, simo, clone, 另存, revision, 版本衝突, cycle]
    invariants:
      - SIMO 標記列（simo_group_id 非空）貢獻 0，時間由未標記主列吸收；不取 group max（ADR-020，對齊 v3 認證版）
      - most_cycle.wi_row_id 為 1:1（worksheet 情境）；clone 必須保留全部 LB tag 欄與 wi_group
      - 前端不算 TMU；儲存 body 由 buildSaveBody 產出，derive() 的 null（非鏈首層級）須忠實保留
      - 【規劃中，ADR-037 實作後生效】AI 來源列的 provenance 由伺服器依 review_item_id 設定，前端不得傳值；mapper 一律輸出 simo_group_id／simo_with_row_id 為 null（ADR-037 D3、ADR-020）
      - 【規劃中，ADR-037 實作後生效】AI 採用落盤只走既有 save_worksheet，帶 base_revision，不得另開寫 wi_rows／most_cycles 的路徑（ADR-037 D5）
      - 新產生內容先進編輯區、經「寫入工時表」才落盤（ADR-038）。W1 已落地後端（`wi_draft_rows` 資料表與 6 個 API，2026-11-23）；W4 前端編輯區已落地（2026-11-24）：工時表編輯器的「加入」改為加入編輯區（手動列也要先確認再寫入，ADR-038 D2 W4 追記），舊的直接加列路徑不得復活
      - 編輯草稿（載入編輯器→「更新草稿」→PATCH）時，沒改格位就原封保留草稿的 cycle，不得重新產生；改了格位才整個換成編輯器產出並清空敘述（否則「打開再存」會改動 AI 內容形狀，並繞過後端以 `cycle_hash` 判斷的 `DRAFT_INCOMPLETE`）（ADR-038 D3，2026-11-24 W4）
      - 寫入工時表前，表上（含 level、LB 標記）有未存檔修改就擋；寫入帶 `base_revision`，409 版本衝突時草稿維持 `confirmed`、重新載入；整份存檔不帶 `distance_status`（ADR-038 D3，2026-11-24 W4）
      - 工時表既有列仍可在表上直接改、排序、刪除後整份存檔；編輯區只管新產生的內容（ADR-038 D3，2026-11-24 W4）
      - 整份上傳一律進編輯區：工作區上傳（`UploadInput`）；標頭「匯入 Excel」按鈕也打開工作區上傳。舊的「範本採用＋直接寫工時表」流程沒有畫面入口（Howard 2026-11-24 選 A；範本採用搬進工作區見 BL-ENG-21；ADR-038 D3 W5 追記）
      - 沒有產生草稿的 Excel 列（超長、解析失敗、寫不進去）可建空白草稿（`drafts/blank-from-import`）：只接受綁這份工時表的匯入列、已有草稿的列跳過、`source=imported` 帶 `import_row_id`、`parse_snapshot.complete=false`（補齊格位前 `DRAFT_INCOMPLETE`）、納入過期判斷；建 job 前先驗目標工時表（404／409／422，規則版本不同 409 `field=rule_set_code`）（ADR-038 D3，2026-11-24 W5）
      - 整份存檔（save_worksheet）不得抹除既有列（沿用 id）的 provenance／source_import_id／source_module_*；新 id 才是 manual（ADR-037 D5，2026-11-23 W1）
      - 編輯區草稿不得出現在工時表讀取、匯出、LB 投影或核准流程（ADR-038 I2）
      - 距離完成檢查以每列明確的 `distance_status` 判斷，不看距離數值（A0 是合法值）；`distance_check_required` 只在 `drafts/commit` 打開、之後不關，未開啟的既有工時表不檢查（ADR-038 D6，2026-11-23 W2）。`distance_status` 不入 content_hash
      - 整份存檔（save_worksheet）列沒帶 `distance_status`＝保留同 id 既有值，帶 null 才清除；**例外（W7b）**：舊值是 `confirmed` 且 `distance_inputs`（GM／CM、object／from／to、a0／a3／a6 的 reach／foot、m3 各分量的動詞與距離）有任何不同 → 退回未標示；`manual`／`not_applicable` 不動，明確帶值以帶的為準；核准先鎖工時表列再依序做 level gate、距離檢查，存檔與編輯區寫入拿到列鎖後須再確認版本仍是 draft（ADR-038 D6，2026-11-23 W2；退回例外 2026-11-24 W7b，取代 W2 的「決定 B：暫不退回」）
      - 前端整份存檔只對使用者在畫面上改過距離狀態的列帶 `distance_status`（store 的 `distanceStatusChanged`），其餘列不帶；每列都帶會繞過 W7b「改了距離輸入就退回」（ADR-038 D6，2026-11-24 W8）
      - 解析產生的草稿（單句 AI、整份上傳）的可接受性＝人按確認＋寫入時 `compute_rows_for_save` 以工時表規則版本重算（等價 engine_gate）；解析不完整（`parse_snapshot.complete=false`）且 cycle 未被人改過 → 確認與寫入 409 `DRAFT_INCOMPLETE`。`rule_based` 草稿同規則；W1 的外部 AI 草稿 Fail-Fast 已移除（ADR-038 D3、ADR-037 D3／D5，2026-11-24 W3）
      - 草稿一律追加表尾、不引用既有列，所以 stale 只看兩個條件：`source_rule_set_id` ≠ 工時表 `default_rule_set_id`（`rule_set_changed`）、Excel 列 `input_hash` 變了或被刪（`import_row_changed`）→ 409 `DRAFT_STALE`，整筆寫入作廢、另開交易把草稿退回 pending 並記 `stale_reason`；一般存檔不算過期（ADR-038 D3，2026-11-24 W3）
      - 草稿寫入後 provenance：`ai_service`→`ai_external`；來自 Excel 列→`imported`（帶 `source_import_id`）；其餘→`manual`。外部 AI 與 `nl-draft` 同一套分流（`wi_ai_service.external_for`），單句端點先確認工時表可編輯、編輯區有空位才呼叫 AI（2026-11-24 W3）

