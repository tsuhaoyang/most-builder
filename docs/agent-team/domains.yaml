  - id: spatial-distance
    title: 區域、DSX 座標快照、物件歸區與自動算距離（ADR-038 D5）
    anchors: [zone_service, sync_from_dsx, set_object_zones, worksheet_objects, dsx_client]
    paths:
      - "src/ddm_v2/services/v2/zone_service.py"
      - "src/ddm_v2/api/routes/v2/zone.py"
      - "src/ddm_v2/schemas/v2/zone.py"
      - "src/ddm_v2/models/v2/zone.py"
      - "src/ddm_v2/services/v2/dsx_client.py"
      - "migrations/versions_v2/v2_0054_sku_zones.py"
      - "tests/integration/test_zones.py"
      - "tests/unit/test_dsx_client_w7.py"
      # W7b：算距離、建議、套用、距離設定
      - "src/ddm_v2/services/v2/distance_service.py"
      - "src/ddm_v2/api/routes/v2/distance.py"
      - "src/ddm_v2/schemas/v2/distance.py"
      - "src/ddm_v2/models/v2/distance.py"
      - "migrations/versions_v2/v2_0055_distance_suggestions.py"
      - "tests/integration/test_distance_suggestions.py"
      - "tests/unit/test_distance_suggest.py"
      - "src/frontend/src/features/wi-workbench/distance/**"
      - "src/frontend/e2e/workspace-distance.spec.ts"
    docs:
      - docs/decisions/ADR-038-unified-wi-workspace-and-two-stage-distance.md
      - docs/decisions/ADR-031-spatial-layout-and-distance-acquisition.md
      - docs/roadmap/adr-038-delivery-plan.md
    keywords: [zone, 區域, dsx, placement, 座標, 快照, snapshot, 歸區, 距離, distance, reach, foot, 標準工作站]
    invariants:
      - 區域、座標快照、物件歸區一律按 SKU（skus.id）保存，不按工序版本、不按廠區；不新增工位主數據（ADR-038 D5.1）
      - 區域中心座標只由「從 DSX 同步」寫入並記快照 id；不即時查 DSX，3D 裡的拖動在下次同步前不改變任何已存座標（ADR-038 D5.4、I6）
      - 快照裡找不到綁定物件時清空中心並回報，不沿用舊座標；換綁 DSX 物件清空中心（要重新同步）
      - DSX 三種失敗分開回報（未開 503 DSX_DISABLED、連不到 502 DSX_UNREACHABLE、未就緒 409 DSX_NOT_READY）；物件清單連不到回 available=false，不偽裝成空清單（ADR-038 D5.3／D5.4）
      - DSX 沒有認證：瀏覽器不直連 DSX；DSX 回應當不可信輸入（本文 ≤ 2 MB、≤ 2000 筆，超過整份拒絕不截斷；字串 ≤ 200；座標 |v| ≤ 1000 cm 且為有限數；拒絕重複 id；station_id 必填；placement_revision 0..2^31-1）
      - 鎖順序一律先 SKU 再區域；物件歸區只接受未刪除且啟用的物件；呼叫 DSX 前先結束資料庫交易（不在等 DSX 時佔連線）
      - 物件歸區的區域必須屬於同一 SKU（複合 FK）；區域還有物件歸區時不能刪（ZONE_IN_USE）
      - 算出的距離只是建議（帶出處），不直接寫入 TMU 路徑；MOST 只算公分，TMU 一律由引擎算（ADR-031 I1、I4、I5）
      - 套用距離建議是列級：該列每一格都是 `suggested` 才套用，且請求要帶 `computed_at`（使用者看到的那次計算）與 `base_revision`；否則 409 `DISTANCE_NOT_APPLICABLE`／`DISTANCE_SUGGESTION_CHANGED`，不做格位級部分套用。成功走整份存檔，目標列 `distance_status=confirmed`（ADR-038 D5.6，2026-11-24 W7b）
      - 前端整份存檔只對使用者在畫面上改過距離狀態的列帶 `distance_status`（store 的 `distanceStatusChanged`），其餘列不帶；每列都帶會繞過 W7b「改了距離輸入就退回」（ADR-038 D6，2026-11-24 W8）
      - 距離建議 `needs_ie`（a6 > 門檻、m3 > 75 cm 或沒有／多個 ladder 分量）與 `unavailable` 不寫入任何值、不截斷、不歸零；判定用未取整的距離（ADR-031 I5，ADR-038 D5.6 (c)）
      - 距離設定（門檻、人端偏移）在建模政策 `policy_json["distance"]`；新發布的設定只影響之後新建的工時表，既有工時表（含 clone）沿用自己的版本。版本沒有 `distance` 段時用 `DEFAULT_DISTANCE_SETTINGS`（70 cm、`[0,0,140]`），這組常數凍結不得修改，要換值發布新版本。新建工時表的政策版本由 `modeling_policy_defaults` 明確指定，不以 MAX 隱式選版（R2a；2026-11-24 W7b）

