# MOST（ddm-v2）領域登記表（dev-team 單一真相）
#
# 用途：把「業務邏輯領域」對應到（程式路徑、graphify 錨點、權威文件、不可違反的約束）。
# 消費者：
#   - docs/agent-team/agents/most-logic-reviewer.md （每個受影響領域派一個實例）
#   - docs/agent-team/checkpoint.md
#   - scripts/agent_team/domain_guard.py            （改檔／討論時的提醒）
#   - scripts/agent_team/check_agent_config.py       （check_8：每個業務檔至少命中一領域）
#
# 維護規則（同 LB）：
#   - 新增領域＝加一筆條目，不新增 agent（logic reviewer 參數化）。
#   - anchors 給 graphify（`graphify explain "<anchor>"`）；paths 可能過時，anchors 跟著圖走。
#   - invariants 只寫「違反就是 bug」的硬規則，抄自 ADR 的已鎖定決策；不確定的不要寫。
#   - docs 是該領域權威文件；邏輯變更經使用者核可後，most-doc-sync 只改這裡列出的檔案。
#   - 來源範本：line-balance_stream-weaver_v2/docs/agent-team/domains.yaml（commit 2b59ddc）。

version: 1
updated: 2026-09-16

