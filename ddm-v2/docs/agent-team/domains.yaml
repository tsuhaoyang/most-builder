    invariants:
      - store（useLevelStore）為唯一真相；作業視圖是純函式反投影，動作寫回同一 store（不另存 t()／useRowNarr 產物）
      - 作業版不接 LLM、不做關鍵字猜測；提示由投影資料的確定性規則產生（hints.py）
      - 預覽走 dry-run 端點；hydrate/baseline 完成前不發預覽（避免 E_LEVEL_INVALID 閃錯）

