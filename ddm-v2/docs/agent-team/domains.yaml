      - "src/ddm_v2/services/v2/lb_writeback_service.py"
      - "src/ddm_v2/models/v2/lb_writeback.py"
    docs:
      - docs/lb-integration/MOST_LB_DATA_CONTRACT_SPEC.md
      - docs/decisions/ADR-035-lb-projection-layer-and-motion-decomposition.md
      - docs/lb-integration/LB_PROJECTION_IMPLEMENTATION_PLAN.md
      - docs/decisions/ADR-036-lb-writeback-consumption.md
      - docs/lb-integration/LB_WRITEBACK_CONSUMPTION_IMPLEMENTATION_SPEC.md
    keywords: [lb, projection, 投影, lb-csv, task, tool episode, acquire, release, quantity, qty_scope, repeat, contract_version, writeback, 回寫]
    invariants:
      - CSV 24 欄名與順序凍結；任何變動＝contract_version 升版＋LB 契約同步（Spec §6/§7.8）
      - 黃金 fixture 投影後與 server_node_tasks.expected.csv 逐位元相等（tasks_out=34）
      - E_TOOL_ID_SHARED_ACROSS_LOT 維持 E（擋匯出），降級條件＝LB feature/most-integration-phase2 合入 master 後
      - SIMO 從屬列不輸出、p2 恆空、complexity_level 恆空（ADR-035 D9 過渡守衛；SIMO 為定案，其餘為過渡）
      - repeat_counts 由 slot_inputs 推導（不得硬寫空 dict）；clone 保留全部 9 個 LB tag 欄
      - 回寫（ADR-036）只回流 offline，且必走 MOST 組內傳染與 R1–R9 驗證；其餘欄位（workers/station/units/line）唯讀；結構欄不回流。general 判定用 MOST 自己的 is_general，不從 LB payload 猜

