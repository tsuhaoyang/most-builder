    title: Excel／CSV 匯入
    anchors: [import_service, TARGET_FIELDS, map_columns, submit_import, dsx_service]
    paths:
      - "src/ddm_v2/services/v2/import_service.py"
      - "src/ddm_v2/services/v2/dsx_service.py"
      - "src/ddm_v2/services/v2/dsx_client.py"
      - "src/ddm_v2/api/routes/v2/import_excel.py"
      - "src/ddm_v2/api/routes/v2/dsx.py"
      - "src/ddm_v2/schemas/v2/import_excel.py"
      - "src/ddm_v2/schemas/v2/dsx.py"
      - "src/ddm_v2/models/v2/import_staging.py"
      - "src/ddm_v2/models/v2/dsx_suggestion.py"
      - "src/frontend/src/features/import/**"
      - "src/frontend/src/features/export/**"
      # D10 e2e 隨舊匯入流程移除（Howard 2026-11-24 選 A）；BL-ENG-21 恢復
    docs:
      - docs/decisions/ADR-013-excel-import-architecture.md
      - docs/decisions/ADR-037-ai-service-integration.md
    keywords: [import, 匯入, excel, csv, target_fields, column map, 欄位對應, staging, dsx, wi_group]
    invariants:
      - 匯入為兩階段（staging→submit）；column_map 缺 description 擋提交（ADR-013）
      - 匯入建列填 wi_group（TARGET_FIELDS 含 wi_group）
      - 超過 MAX_PARSE_TEXT_CHARS 的列不外送（現況已生效：import_service 標 review、parse_job 跳過）
      - 批量 AI 只送 description（Excel 手別只用於 MOST 端比對）；Excel 數量為權威，歸屬依 ADR-037 D6 四條規則預填到草稿 `frequency`（持工具時暫不走 `repeat_count`；依據記在 `parse_snapshot.quantity`），草稿仍 pending、逐項審核（ADR-037 D6、ADR-038 W3b，2026-11-24）
      - parse job 的 `tick_job` 是逐列交易：認領後 commit，每列各自 commit，計數逐列原子遞增；外部 AI 呼叫期間不持有 job 列鎖或工時表列鎖；AI 回來後須鎖 item 並確認仍是本 worker 的才寫回（ADR-038 W3b，2026-11-24）
      - 匯入綁了 `worksheet_id` 時，parse job 每列解析後寫進該工時表的編輯區（savepoint），不直接寫工時表；手別與作業名稱取 Excel 欄；job 規則版本與工時表不同、工時表不可寫、編輯區滿 → 不寫，原因記在 `item.last_error.drafts`；重新解析同一列只取代沒人動過的 pending 草稿（ADR-038 D3，2026-11-24 W3）。既有 submit 保留
      - 工作區上傳：`upload?worksheet_id` 綁工時表、建 job 的 `idempotency_key=workspace:<import_id>`、規則版本用工時表的；工作區沒有範本採用面板（BL-ENG-21）；標頭匯入按鈕打開工作區上傳，舊 submit 流程沒有畫面入口（Howard 2026-11-24 選 A）。`GET /imports/{id}/parse-jobs/{job_id}/items` 與 `drafts/blank-from-import` 為 analyst；空白草稿規則見 wi-workbench（ADR-038 D3，2026-11-24 W5）

