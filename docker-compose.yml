# 釘死 compose 專案名：repo 根目錄 2026-11-11 由 ddm-v2/ 改為 most-builder/，
# 若讓 compose 以目錄名推導，volume 會從 ddm-v2_ddm-v2-pgdata 變成新名＝空 DB。
name: ddm-v2

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ddm-v2-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ddm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ddm_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ddm_v2}
    volumes:
      - ddm-v2-pgdata:/var/lib/postgresql/data
    # 不對 host 發佈 DB port：app 走內部網路（service name `db`），prod 不需要、也避免與
    # 既有 Postgres 衝突。若需主機 psql/alembic，疊上 docker-compose.dev.yml（見該檔）。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ddm_user} -d ${POSTGRES_DB:-ddm_v2}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ddm-v2:
    build:
      context: .
      # build 時用主機網路：公司 proxy 常常 build 容器(bridge)路由不到 → Network unreachable。
      # 走 host 網路 → 主機連得到 proxy，pip/npm 就連得到。
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    image: ddm-v2:202603-rc1
    container_name: ddm-v2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # ⚠️ 只綁 loopback（ADR-023 D7 / C-1）。gateway 模式（本檔預設）**無條件信任入站的
    # `X-Username` header**——把這個 port 曝露到 loopback 以外，等同開放「零憑證即 admin」
    # 的存取（`curl -H 'X-Username: <任一員編>' .../api/v2/me` 就會拿到身分，甚至 JIT 建帳）。
    # 要對外提供服務，前面**必須**掛 Traefik ForwardAuth（由 gateway 覆寫 X-Username），
    # 不可直接改成 0.0.0.0。過渡期若真的需要直接對外，請改用 DDM_AUTH_MODE=verify
    # （自驗 LB session、不讀 client 的 X-Username）。
    ports:
      - "127.0.0.1:${DDM_PORT:-8877}:8000"
    environment:
      DDM_ROOT_DIR: /app
      DDM_DATA_DIR: /app/data
      DDM_SECRET_KEY: ${DDM_SECRET_KEY:-ddm-v2-release-candidate-202603-rc1-secure-key}
      DDM_CORS_ALLOW_ORIGINS: ${DDM_CORS_ALLOW_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
      DDM_CORS_ALLOW_METHODS: ${DDM_CORS_ALLOW_METHODS:-GET,POST,PUT,DELETE}
      DDM_CORS_ALLOW_HEADERS: ${DDM_CORS_ALLOW_HEADERS:-Authorization,Content-Type}
      DDM_CORS_ALLOW_CREDENTIALS: ${DDM_CORS_ALLOW_CREDENTIALS:-true}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ddm_user}:${POSTGRES_PASSWORD:-ddm_pass}@db:5432/${POSTGRES_DB:-ddm_v2}
      # 身分來源：gateway（預設，信任 ForwardAuth header）｜ verify（自驗 LB session，可直接開 port）
      DDM_AUTH_MODE: ${DDM_AUTH_MODE:-gateway}
      DDM_LB_VERIFY_URL: ${DDM_LB_VERIFY_URL:-}
      DDM_SESSION_COOKIE_NAME: ${DDM_SESSION_COOKIE_NAME:-session_id}
      ENV: ${ENV:-development}
      # 開機自動建為 admin 的員工編號（設成你「真實的員編」才能登入後就是 admin）
      DDM_ADMIN_EMPLOYEE_NO: ${DDM_ADMIN_EMPLOYEE_NO:-IEC141289}
      # true＝開機自動種 rule-set + demo worksheet(5555) + 詞彙 + 範本（idempotent，過渡建議開）
      DDM_SEED_DEMO: ${DDM_SEED_DEMO:-false}
      # ai_parse_jobs 背景 worker（語意與可調值見 .env.example）。程式端預設就是 true/3.0/4，
      # 這裡把三個都顯式接出來的理由：compose 只會傳遞**列在這裡**的變數，少列一個，
      # 部署者在 .env 設了它卻毫無作用，而 .env.example 又寫著可以設——那就是文件在說謊。
      DDM_PARSE_WORKER_ENABLED: ${DDM_PARSE_WORKER_ENABLED:-true}
      DDM_PARSE_WORKER_INTERVAL_S: ${DDM_PARSE_WORKER_INTERVAL_S:-3.0}
      DDM_PARSE_WORKER_BATCH: ${DDM_PARSE_WORKER_BATCH:-4}
      # DSX 3D 整合（a3 距離查詢 + 擺放介面 iframe 入口）。預設關閉，跨網段搬遷時
      # 只需要改 .env 的 DDM_DSX_API_BASE_URL／DDM_DSX_UI_URL，不必動程式或本檔。
      DDM_DSX_INTEGRATION_ENABLED: ${DDM_DSX_INTEGRATION_ENABLED:-false}
      DDM_DSX_API_BASE_URL: ${DDM_DSX_API_BASE_URL:-}
      DDM_DSX_UI_URL: ${DDM_DSX_UI_URL:-}
      DDM_DSX_TIMEOUT_S: ${DDM_DSX_TIMEOUT_S:-5.0}
      # 外部 ai_service（ADR-037；語意與預設見 .env.example 與 src/ddm_v2/ai_integration/config.py）。
      # 預設關閉。理由同上方 parse worker：compose 只傳**列在這裡**的變數，少列一個，.env 設了也沒用。
      #
      # 金鑰：**正式環境請用 DDM_AI_SERVICE_KEY_FILE**，DDM_AI_SERVICE_KEY 留空。
      #   用環境變數放金鑰，`docker inspect`、`docker compose config` 與容器的 /proc/<pid>/environ 都看得到，
      #   有 docker 權限的人就能讀到。程式本身不會把金鑰寫進 log、DB 或錯誤訊息，風險在部署層。
      #   檔案版做法（兩者都設時檔案優先）：
      #     1. 主機上建檔：install -m 0400 /dev/null ./secrets/ai_service_key，再把金鑰寫進去（不要進版控）
      #     2. 解開本服務底下的 `secrets:` 與檔尾頂層 `secrets:` 兩段註解
      #     3. .env 設 DDM_AI_SERVICE_KEY_FILE=/run/secrets/ai_service_key
      DDM_AI_SERVICE_ENABLED: ${DDM_AI_SERVICE_ENABLED:-false}
      DDM_AI_SERVICE_BASE_URL: ${DDM_AI_SERVICE_BASE_URL:-}
      DDM_AI_SERVICE_ALLOWED_HOSTS: ${DDM_AI_SERVICE_ALLOWED_HOSTS:-}
      DDM_AI_SERVICE_ALLOW_PLAINTEXT: ${DDM_AI_SERVICE_ALLOW_PLAINTEXT:-false}
      DDM_AI_SERVICE_KEY: ${DDM_AI_SERVICE_KEY:-}
      DDM_AI_SERVICE_KEY_FILE: ${DDM_AI_SERVICE_KEY_FILE:-}
      DDM_AI_SERVICE_BUNDLE_CODE: ${DDM_AI_SERVICE_BUNDLE_CODE:-}
      DDM_AI_SERVICE_SERVICE_USER: ${DDM_AI_SERVICE_SERVICE_USER:-}
      DDM_AI_SERVICE_PLANT_CODE: ${DDM_AI_SERVICE_PLANT_CODE:-}
      DDM_AI_SERVICE_TIMEOUT_S: ${DDM_AI_SERVICE_TIMEOUT_S:-}
      DDM_AI_SERVICE_MAX_RETRIES: ${DDM_AI_SERVICE_MAX_RETRIES:-}
      DDM_AI_SERVICE_CONCURRENCY_INTERACTIVE: ${DDM_AI_SERVICE_CONCURRENCY_INTERACTIVE:-}
      DDM_AI_SERVICE_CONCURRENCY_BATCH: ${DDM_AI_SERVICE_CONCURRENCY_BATCH:-}
      DDM_AI_SERVICE_PER_USER_PER_MINUTE: ${DDM_AI_SERVICE_PER_USER_PER_MINUTE:-}
      DDM_AI_SERVICE_DAILY_BUDGET: ${DDM_AI_SERVICE_DAILY_BUDGET:-}
    # 外部 ai_service 金鑰檔（見上方說明）。要用時解開這兩行，以及檔尾的頂層 `secrets:`。
    # secrets:
    #   - ai_service_key

volumes:
  ddm-v2-pgdata:

# 外部 ai_service 金鑰檔（見 ddm-v2 服務的 DDM_AI_SERVICE_* 說明）。要用時連同服務底下的 `secrets:` 一起解開。
# secrets:
#   ai_service_key:
#     file: ./secrets/ai_service_key
