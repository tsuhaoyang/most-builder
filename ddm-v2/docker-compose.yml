services:
  db:
    image: postgres:16-alpine
    container_name: ddm-v2-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ddm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ddm_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ddm_v2}
    volumes:
      - ddm-v2-pgdata:/var/lib/postgresql/data
    # 不對 host 發佈 DB port：app 走內部網路（service name `db`），prod 不需要、也避免與
    # 既有 Postgres 衝突。若需主機 psql/alembic，疊上 docker-compose.dev.yml（見該檔）。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ddm_user} -d ${POSTGRES_DB:-ddm_v2}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ddm-v2:
    build:
      context: .
      # build 時用主機網路：公司 proxy 常常 build 容器(bridge)路由不到 → Network unreachable。
      # 走 host 網路 → 主機連得到 proxy，pip/npm 就連得到。
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    image: ddm-v2:202603-rc1
    container_name: ddm-v2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${DDM_PORT:-8877}:8000"
    environment:
      DDM_ROOT_DIR: /app
      DDM_DATA_DIR: /app/data
      DDM_SECRET_KEY: ${DDM_SECRET_KEY:-ddm-v2-release-candidate-202603-rc1-secure-key}
      DDM_CORS_ALLOW_ORIGINS: ${DDM_CORS_ALLOW_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
      DDM_CORS_ALLOW_METHODS: ${DDM_CORS_ALLOW_METHODS:-GET,POST,PUT,DELETE}
      DDM_CORS_ALLOW_HEADERS: ${DDM_CORS_ALLOW_HEADERS:-Authorization,Content-Type}
      DDM_CORS_ALLOW_CREDENTIALS: ${DDM_CORS_ALLOW_CREDENTIALS:-true}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ddm_user}:${POSTGRES_PASSWORD:-ddm_pass}@db:5432/${POSTGRES_DB:-ddm_v2}
      # 身分來源：gateway（預設，信任 ForwardAuth header）｜ verify（自驗 LB session，可直接開 port）
      DDM_AUTH_MODE: ${DDM_AUTH_MODE:-gateway}
      DDM_LB_VERIFY_URL: ${DDM_LB_VERIFY_URL:-}
      DDM_SESSION_COOKIE_NAME: ${DDM_SESSION_COOKIE_NAME:-session_id}
      ENV: ${ENV:-development}
      # 開機自動建為 admin 的員工編號（設成你「真實的員編」才能登入後就是 admin）
      DDM_ADMIN_EMPLOYEE_NO: ${DDM_ADMIN_EMPLOYEE_NO:-IEC141289}
      # true＝開機自動種 rule-set + demo worksheet(5555) + 詞彙 + 範本（idempotent，過渡建議開）
      DDM_SEED_DEMO: ${DDM_SEED_DEMO:-false}

volumes:
  ddm-v2-pgdata:
