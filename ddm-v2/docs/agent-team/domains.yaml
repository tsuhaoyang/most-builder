domains:
  - id: most-engine
    title: MiniMOST 序列模型與 TMU 單一權威引擎
    anchors: [compute_cycle, compute_table, _a_tmu, _m_tmu, build_from_seed_v2, resolve_multiplier]
    paths:
      - "src/ddm_v2/most_engine/calculate.py"
      - "src/ddm_v2/most_engine/providers.py"
      - "src/ddm_v2/most_engine/rule_set_data.py"
      - "src/ddm_v2/most_engine/narrative.py"
      - "src/ddm_v2/most_engine/narrative_en.py"
      - "src/ddm_v2/most_engine/__init__.py"
      - "src/ddm_v2/api/routes/v2/calculate.py"
      - "src/ddm_v2/schemas/v2/most.py"
    docs:
      - docs/core-logic/minimost-sequence-model-core-logic-spec.md
      - docs/core-logic/core-logic-validation-test-catalog.md
      - docs/decisions/ADR-028-most-engine-boundary-validation-and-single-authority.md
      - docs/decisions/ADR-014-v3-dictionary-as-value-authority.md
    keywords: [tmu, minimost, most engine, 引擎, 七格, gm, cm, golden, 黃金值, calculate, a_tmu, m_tmu, simo]
    invariants:
      - most_engine 是所有 TMU 計算與 level 驗證的單一權威；前端不得自算，值一律來自 POST /api/v2/minimost/calculate（ADR-028）
      - 邊界驗證（如 A_NEGATIVE）加在 calculate.py 的計算點、不加在查表 helper；A／M 對稱（ADR-028）
      - 動到 calculate.py／rule-set seeds／level rules／schemas/v2/most.py → 必過 scripts/core_logic/run_all.py（錨點 GM=28、CM=29）
      - rule-set 值來自 DB，引擎執行期讀取；MostCycle 以 per-cycle rule_set_id 釘版回放

  - id: rule-set
    title: Rule-set 版本治理與回放
    anchors: [rule_set_service, clone_draft, next_version_no, rule_option_service, rule_set_diff]
    paths:
      - "src/ddm_v2/services/v2/rule_set_service.py"
      - "src/ddm_v2/services/v2/rule_set_diff.py"
      - "src/ddm_v2/services/v2/rule_option_service.py"
      - "src/ddm_v2/services/v2/synonym_service.py"
      - "src/ddm_v2/services/v2/policy_service.py"
      - "src/ddm_v2/api/routes/v2/rule_set.py"
      - "src/ddm_v2/api/routes/v2/synonyms.py"
      - "src/ddm_v2/models/v2/rule_set.py"
      - "src/ddm_v2/models/v2/rule_set_tables.py"
      - "src/ddm_v2/models/v2/synonym.py"
      - "src/ddm_v2/models/v2/policy.py"
      - "src/ddm_v2/schemas/v2/rule_set_options.py"
      - "src/ddm_v2/seed/v2/rule_set_seed.py"
      - "src/ddm_v2/seed/v2/rule_set_seed_v2.py"
      - "src/ddm_v2/seed/v2/policy_seed.py"
    docs:
      - docs/decisions/ADR-023-dictionary-governance-unification.md
      - docs/decisions/ADR-025-import-template-matching-p2.md
    keywords: [rule-set, rule set, 規則版本, clone, 發布, published, draft, retired, 回放, synonym, 同義詞, 詞彙治理]
    invariants:
      - 已發布版不可變；改動走 clone→改→發布；舊 worksheet 以釘版 rule_set_id 維持原值（ADR-023）
      - version_no 配號須序列化（per-SKU advisory lock），避免併發 COUNT+1 競態

  - id: level-system
    title: Level System（R1–R9 巢狀關係與驗證）
    anchors: [validate, level_validation_service, LevelEntry, ascription, countersignature]
    paths:
      - "src/ddm_v2/most_engine/level.py"
      - "src/ddm_v2/services/v2/level_validation_service.py"
      - "src/ddm_v2/models/v2/level_validation.py"
    docs:
      - docs/core-logic/level-system-core-logic-spec.md
      - docs/decisions/ADR-028-most-engine-boundary-validation-and-single-authority.md
    keywords: [level system, r1, r9, 層級, main, sub, cub, nb, ascription, countersignature, 巢狀, 難度係數]
    invariants:
      - level 驗證權威在 most_engine/level.py；R1–R9 規則不得在服務層另立分支
      - 同一 top-level chain 的成員 level 字串一致；非鏈首成員 ascription／level 為 null

