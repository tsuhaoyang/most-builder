      - "src/ddm_v2/models/v2/ai_ops.py"
    docs:
      - docs/decisions/ADR-033-llm-planner-scope-narrowing.md
    keywords: [compiler, 編譯, nl, 自然語言, llm, planner, 草稿, draft, quantity policy, rule_based, lexicon]
    invariants:
      - NL 數量／頻率經 QuantityPolicyV2（resolve_multiplier）解析，對 TMU 中性（ADR-033）
      - LLM 只做受限 planner，不得成為 TMU／規則的權威來源；引擎閘門（engine_gate）擋不合法序列

  - id: lb-projection
    title: LB 投影層（motion→task、工具生命週期、匯出契約）
    anchors: [project_rows, build_report, ToolLifecycleResolver, decompose_engine, rows_from_worksheet, to_lb_csv]
    paths:
