      - docs/decisions/ADR-033-llm-planner-scope-narrowing.md
      - docs/decisions/ADR-037-ai-service-integration.md
      - docs/decisions/ADR-026-wi-ai-parser-pipeline-boundary.md
      - docs/decisions/ADR-015-nl-parsing-in-scope.md
      - docs/decisions/ADR-035-lb-projection-layer-and-motion-decomposition.md
      - docs/decisions/ADR-031-spatial-layout-and-distance-acquisition.md
      - docs/decisions/ADR-025-import-template-matching-p2.md
    keywords: [compiler, 編譯, nl, 自然語言, llm, planner, 草稿, draft, quantity policy, rule_based, lexicon]
    invariants:
      - NL 數量／頻率經 QuantityPolicyV2（resolve_multiplier）解析，對 TMU 中性（ADR-033）
      - 【規劃中，ADR-037 實作後生效】外部 AI 服務（ai_service）只提供建議；入站經 mapper allow-list、sanitize、validate；slot code 只是候選，須過目標 rule-set、compile、engine_gate；hand／seq_kind 不採信；TMU 只來自引擎（ADR-037 D3，修訂 ADR-033 D2）
      - compile 不讀 role.value 作距離或秒數；外部或人工數值不得寫入 role.value，須走帶出處的 PlannedAction.measurements，且外部 planner 提供的一律剝除（ADR-033 P3 前兩項，2026-11-14 落地；ADR-037 D3、ADR-031 D4）。例外：數量仍讀 quantity 角色的 role.value，出處欄位留到 ADR-037 S5；Measurement 是出處即憑據，不掛 distance_unevidenced_review
      - ADR-033 D1（LLM 不產數值）、D6（逐項降級）、D7（距離單一來源）對外部 AI 回應維持為入站不變量（ADR-037 D3）
      - AI 建議一律逐項人工採用，不設批次或自動接受（ADR-037 D4、ADR-026 §3）；wi_ai_auto_enabled 現況為預設關、可由 env 開啟，ADR-037 落地時須改為不可開
      - 外部 AI 路徑（`parse_interactive(external=...)`）一律 `compute_routing(auto_enabled=False)`，不受 `wi_ai_auto_enabled` 影響（ADR-037 D4；2026-11-22 PR-B 落地）。上一條「須改為不可開」仍未完成：rule 路徑仍讀該旗標。路由已接線（2026-11-22，`nl_draft` 在 analyst 以上且整合可用時傳 `external`；預設關）
      - 可接受的 motion（ADR-037 D3）在工作區的落實：人按「確認」＝人工採用（取代「人寫入 `chosen`」；`ai_candidates` 的 `chosen` 仍為 null、只供顯示），寫入時 `compute_rows_for_save` 重算（等價 engine_gate：唯一拒絕條件是 `compute_cycle` 丟 `SequenceError`）；`parse_snapshot.complete` 只是「要人先補」的提示（→ 409 `DRAFT_INCOMPLETE`），不是依據（ADR-038 D3，2026-11-24 W3）。舊前端 adopt 捷徑：`AiDraftPanel.tsx` 已於 W4 移除（2026-11-24）；`ActionModuleWorkspace.tsx`（workbench-v3，只檢查 `draft.cycle`）在 W6 移除前仍在：`DDM_AI_SERVICE_ENABLED` 開啟時仍違反本條
      - nl-draft review 事件（學習迴圈）現況暫停：工作區不再送（`AiDraftPanel` 移除）。後續由後端在 `commit_drafts` 以 `ai_parse_run_id` 與最終 content 產生 review 事件，前端不補送（ADR-038 D3 W4 追記，BL-ENG-20，2026-11-24 W4）
      - ai_service 候選的預覽 draft（`chosen` 恆為 None，`preview_drafts`）其 complete／引擎結果不得作為「可接受 motion」的依據（ADR-037 D3 澄清，2026-11-22）。編輯區草稿以預覽值預填但狀態為 pending，須經人確認、寫入時重算才算數（ADR-038 D3，2026-11-24 W3）；整份上傳的 parse job 以路徑 A 走外部 AI（`lane=batch`，只送 description）：建立者執行時被降權則以 rule_based 完成，額度用完的列降級、不自動重試（ADR-037 D7／D8、ADR-038 W3b，2026-11-24）
      - 凍結列舉不得收窄，舊 ai_parse_runs 列須讀得回（ADR-037 D1）
      - 【規劃中，ADR-037 實作後生效】外送只含 WI 語句與白名單 context（ADR-037 D6／D7）

  - id: lb-projection
    title: LB 投影層（motion→task、工具生命週期、匯出契約）
    anchors: [project_rows, build_report, ToolLifecycleResolver, decompose_engine, rows_from_worksheet, to_lb_csv]
    paths:
      - "src/ddm_v2/lb_projection/**"
      - "src/ddm_v2/services/v2/export_service.py"
