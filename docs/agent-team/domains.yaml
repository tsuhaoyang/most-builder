    keywords: [auth, rbac, 權限, role, viewer, analyst, approver, ie, manager, admin, x-username, forwardauth, audit, 稽核, outbox]
    invariants:
      - 角色階層 viewer < analyst < approver < admin（程式 auth/deps.py ROLE_ORDER；口語 IE＝analyst、manager＝approver）；gateway 模式信任入站 X-Username，只綁 loopback（ADR-019、ADR-023 D7b）
      - shared/api/client.ts 是唯一 API 入口；shared/types/api.d.ts 由 OpenAPI 產生、不可手改
      - 編輯區全端點 analyst+，viewer 含 GET 都 403（ADR-038；rbac-spec 讀取例外）
      - 角色判斷只用 `CurrentUser.has` 或 `require_role`，不得另立角色表或比對角色字串；依角色分流（而非拒絕）的端點須在 rbac-spec 註明（例：`POST /worksheets/nl-draft`，viewer 得 200＋rule_based）
