[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddm-v2"
version = "0.1.0"
description = "Refactored DDM release candidate"
requires-python = ">=3.11"
dependencies = [
    # 下界 0.133 是**實測**出來的，不是保守估計；往下放任何一格都有已知的壞法：
    #   * 0.121.0 才有 `Depends(..., scope="function")`（DB session 的 commit 必須排在
    #     response 送出之前，見 tests/unit/test_db_dependency_scope.py）。裝 0.120.4 時
    #     連 `import ddm_v2.main` 都會 `TypeError: Depends() got an unexpected keyword
    #     argument 'scope'`——宣稱支援 0.115 是假的。
    #   * 0.121～0.132 又把 starlette 釘在 <1.0，而「wildcard origin + credentials 會
    #     鏡射任意 Origin」這個 CORS 威脅前提只有 starlette >= 1.0 成立（實測 0.47/0.48/
    #     0.49/0.50 都回 `*`）。0.133.0 是第一個放行 starlette 1.x 的 fastapi。
    # 排除 0.137.0 / 0.137.1：這兩版已經把子路由改成延遲展開的 `_IncludedRouter`，卻還沒
    #   提供官方走訪器 `iter_route_contexts`（0.137.2 才補）。app 本身跑得起來，但所有靠
    #   走訪路由表的啟動期守衛在那裡是失效的（`route_registry` 會明講
    #   RouteTraversalUnsupported 而不是靜默回空）——不支援就寫清楚，別讓宣告說謊。
    # 上界維持 <1.0：0.x 的破壞性變更由 `route_registry` 的「不認得的節點型別」偵測 ＋
    #   tests/unit/test_route_mounting.py 的 OpenAPI 對照擋，不靠版本天花板。收成 `<0.142`
    #   只會讓 Docker build（`pip install -e .`）在 fastapi 每次發版時硬性解不出來，
    #   那個失敗模式比「大聲記 ERROR、服務照跑」更糟，而且要人工追版才能解除。
    "fastapi>=0.133,<1.0,!=0.137.0,!=0.137.1",
    # 由 fastapi 帶入，但 `src/ddm_v2/api/route_registry.py` 直接 import 了
    # starlette.routing 的節點型別（走訪白名單），依 CI gate #1 必須顯式宣告。
    # 下界 1.5.1 有四個獨立理由，每一格都是實測，不是保守估計：
    #   1. CORS 威脅前提（wildcard origin + credentials 會鏡射任意 Origin）只有
    #      starlette >= 1.0 成立，見 tests/unit/test_cors_security.py。
    #   2. CVE-2026-48710（BADHOST 路徑授權繞過，<=1.0.0 受影響，1.0.1 修）。本 app 不用
    #      `request.url.path` 做安全判斷，所以不直接可利用——但沒有理由停在受影響版本。
    #   3. CVE-2026-54283（form limits 在 urlencoded 分支被靜默忽略 → DoS，<1.3.1 受影響）：
    #      **本 app 可利用，且在認證之前**。`POST /api/v2/imports/upload` 宣告
    #      `UploadFile = File(...)`，FastAPI `routing.py` 是先 `await request.form()`
    #      （~406 行）才 `solve_dependencies()`（~457 行，`require_role("analyst")` 在那裡）；
    #      而 starlette 依**實際** Content-Type 分派，攻擊者送 urlencoded 就走到沒有 limit
    #      的 `FormParser`。實測未認證打 5000 欄（預設上限 1000）：starlette 1.0.0/1.3.0
    #      回 401（＝ parser 全收了才輪到認證），1.3.1 回 400（parser 先擋下）。
    #      1.3.0 仍未修，所以那一格是 1.3.1 不是 1.3。
    #   4. `FileResponse.max_ranges = 100`（Range 數量上限）**1.5.1 才加入**（逐版拆 wheel
    #      比對 `starlette/responses.py`：1.3.1/1.5.0 沒有、1.5.1/1.6.0 有）。1.3.1～1.5.0
    #      沒有這道上限，而本 app 的 `/assets/<bundle>.js`（StaticFiles）與 `/`（FileResponse）
    #      都是未認證可達：`Range: bytes=0-0,2-2,…`（刻意不相鄰以避開 merge）會讓伺服器
    #      對檔案做上千次 seek/read 並回一份每 part 都帶 boundary 的 multipart/byteranges。
    #      實測（1 MB 檔、1500 個 range、~14 KB header）：1.5.0 回 206、body 180 KB、
    #      0.46 s CPU；1.5.1/1.6.0 回 200（超過上限就整份送，單次循序讀）、0.012~0.016 s
    #      ——約 29 倍 CPU 差。O(n²) 在更早版本已修，所以是放大而非爆炸，故 Low；
    #      但「宣告的下界＝實際的保護」正是這次事故要根治的病，不接受宣告落後於實裝。
    # 沒有再往上抬到 1.6.0：1.6.0 的新東西是 `RequestBodyLimitMiddleware`
    #   （`starlette/middleware/body_limit.py`，1.5.1 沒有），本 app 目前沒有使用；
    #   為沒在用的功能訂下界＝把下界變回「保守估計」。哪天真的掛上它，這行要抬到 >=1.6.0。
    # 與 fastapi 下界不衝突：fastapi 0.133/0.136/0.137.2/0.141.1 對 starlette 都只有下界
    #   （>=0.40.0 / >=0.46.0）、沒有上界（已拆 wheel METADATA 逐版確認），兩條下界可同時滿足。
    "starlette>=1.5.1,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "PyJWT>=2.8,<3.0",
    # 下界 0.0.18 = CVE-2024-53981（GHSA-59g5-xgcq-4qw3）的修正版；與上面 starlette
    # CVE-2026-54283 是**同一條 pre-auth 路徑上的同型缺陷**，只是這個套件的下界還停在
    # 出事版本。`<0.0.18` 在「最後一個 boundary 之後」的狀態機是逐 byte 走的，每個非
    # CR/LF 的 byte 都送一次 log event（`logger.warning("Consuming a byte ...")`）。
    # 攻擊路徑與 starlette 那條完全相同：未認證者對 `POST /api/v2/imports/upload` 送一個
    # 收尾 boundary 後掛幾十 MB 垃圾的 multipart body；FastAPI 一樣是先 `await request.form()`
    # 才 `solve_dependencies()`（`require_role("analyst")` 在後者），所以 CPU 燒完、
    # event loop 卡死都發生在認證之前。
    # 實測（200 KB 垃圾 epilogue，計 root logger 收到的 record 數）：
    #   0.0.9（＝原本的下界）200,000 events / 0.93 s；0.0.17 200,000 events / 0.94 s；
    #   0.0.18 1 event / <0.001 s；0.0.26 0 events。→ 修正確實落在 0.0.18。
    # 對現況零行為變更（實裝 0.0.26），純粹是讓宣告與已知事實一致；fastapi 自己的
    # `standard` extra 也已經是 `python-multipart>=0.0.18`（0.133~0.141.1 逐版確認）。
    "python-multipart>=0.0.18,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "httpx>=0.28,<1.0",
    "openpyxl>=3.1,<4.0",
    "opencc-python-reimplemented>=0.1.6,<1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0"
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: pure-Python unit tests (no DB)",
    "integration: API tests against the v2 app (need PostgreSQL via DATABASE_URL)"
]
