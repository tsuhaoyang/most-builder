    keywords: [worksheet, 工時表, wi_row, most_cycle, simo, clone, 另存, revision, 版本衝突, cycle]
    invariants:
      - SIMO 標記列（simo_group_id 非空）貢獻 0，時間由未標記主列吸收；不取 group max（ADR-020，對齊 v3 認證版）
      - most_cycle.wi_row_id 為 1:1（worksheet 情境）；clone 必須保留全部 LB tag 欄與 wi_group
      - 前端不算 TMU；儲存 body 由 buildSaveBody 產出，derive() 的 null（非鏈首層級）須忠實保留

